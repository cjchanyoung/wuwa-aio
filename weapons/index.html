<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="weapons_tab_title"></title>
  <meta name="description" content="Complete Wuthering Waves weapons scaling database. Base stats, sub-stats, and passive comparisons for 5-star and 4-star weapons.">
  
  <!-- Font Integrations -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="../output.css">
  
  <!-- i18n Localization -->
  <script src="../js/i18n.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0a080f;
    }
    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a080f;
    }
    ::-webkit-scrollbar-thumb {
      background: #312e3f;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #504a6b;
    }
    
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .glow-effect {
      animation: pulse-glow 4s infinite ease-in-out;
    }
  </style>
</head>
<body class="text-gray-200 overflow-x-hidden min-h-screen flex flex-col selection:bg-yellow-500/30 selection:text-yellow-200">

  <!-- Ambient Glow Effects -->
  <div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-900/10 blur-[120px] pointer-events-none glow-effect"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-purple-900/10 blur-[120px] pointer-events-none glow-effect" style="animation-delay: 2s;"></div>

  <!-- Header Section -->
  <header class="sticky top-0 z-50 bg-[#0a080f]/80 backdrop-blur-md border-b border-purple-500/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <!-- Logo (Home Button) -->
      <a href="../index.html" class="flex items-center space-x-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/20 group-hover:scale-105 transition-transform duration-300">
          <i class="fa-solid fa-wand-magic-sparkles text-white text-lg"></i>
        </div>
        <div>
          <span class="font-display font-bold text-2xl tracking-wide bg-gradient-to-r from-white via-gray-100 to-purple-400 bg-clip-text text-transparent"><span data-i18n="landing_title_prefix"></span><span class="text-purple-500" data-i18n="landing_title_suffix"></span></span>
          <span class="block text-[10px] text-gray-500 tracking-widest uppercase font-semibold" data-i18n="sub_logo"></span>
        </div>
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center space-x-1">
        <a href="../characters/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_characters"></a>
        <a href="../echoes/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_echoes"></a>
        <a href="../weapons/index.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-purple-400 bg-white/5 border-b-2 border-purple-500/50 transition-all" data-i18n="nav_weapons"></a>
        <a href="../quick-swap/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_quickswap"></a>
        <a href="../calculation/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_calculation"></a>
      </nav>

      <!-- Action Button -->
      <div class="flex items-center space-x-4">
        <!-- Mobile Menu Trigger -->
        <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 focus:outline-none">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Navigation Menu -->
  <div id="mobile-menu" class="hidden md:hidden fixed inset-0 z-40 bg-[#0a080f]/95 backdrop-blur-lg pt-24 px-6">
    <div class="flex flex-col space-y-4">
      <a href="../characters/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_characters"></a>
      <a href="../echoes/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_echoes"></a>
      <a href="../weapons/index.html" class="text-xl font-semibold text-purple-400 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_weapons"></a>
      <a href="../quick-swap/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_quickswap"></a>
      <a href="../calculation/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_calculation"></a>
    </div>
  </div>

  <main class="flex-grow">
    <!-- Header Section -->
    <section class="py-12 bg-[#1a181f]/20 border-b border-white/5">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="font-display font-bold text-4xl text-white tracking-wide flex items-center gap-3">
          <span class="w-2.5 h-8 bg-yellow-500 rounded-full inline-block"></span>
          <span data-i18n="weapons_header_title"></span>
        </h1>
        <p class="text-gray-400 text-sm mt-2" data-i18n="weapons_header_subtitle"></p>
      </div>
    </section>

    <!-- Weapons Grid Section -->
    <section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Filters Row -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
        <!-- Weapon Types Selector -->
        <div>
          <span class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2" data-i18n="weapons_filter_type_label"></span>
          <div class="flex flex-wrap gap-2">
            <button class="weapon-filter active px-4 py-2.5 rounded-xl bg-purple-600 text-white text-xs font-semibold tracking-wide uppercase transition-all" data-type="all" data-i18n="weapons_filter_all"></button>
            <button class="weapon-filter px-4 py-2.5 rounded-xl bg-[#1a181f] border border-white/5 text-gray-400 hover:text-white text-xs font-semibold tracking-wide uppercase transition-all" data-type="Rectifier" data-i18n="weapons_filter_rectifier"></button>
            <button class="weapon-filter px-4 py-2.5 rounded-xl bg-[#1a181f] border border-white/5 text-gray-400 hover:text-white text-xs font-semibold tracking-wide uppercase transition-all" data-type="Gauntlets" data-i18n="weapons_filter_gauntlets"></button>
            <button class="weapon-filter px-4 py-2.5 rounded-xl bg-[#1a181f] border border-white/5 text-gray-400 hover:text-white text-xs font-semibold tracking-wide uppercase transition-all" data-type="Pistols" data-i18n="weapons_filter_pistols"></button>
            <button class="weapon-filter px-4 py-2.5 rounded-xl bg-[#1a181f] border border-white/5 text-gray-400 hover:text-white text-xs font-semibold tracking-wide uppercase transition-all" data-type="Sword" data-i18n="weapons_filter_sword"></button>
            <button class="weapon-filter px-4 py-2.5 rounded-xl bg-[#1a181f] border border-white/5 text-gray-400 hover:text-white text-xs font-semibold tracking-wide uppercase transition-all" data-type="Broadblade" data-i18n="weapons_filter_broadblade"></button>
          </div>
        </div>

        <!-- Rarity Selector (Multi-select) -->
        <div>
          <span class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2" data-i18n="weapons_filter_rarity_label"></span>
          <div class="flex gap-2">
            <button class="rarity-filter active px-4 py-2.5 rounded-xl bg-purple-600 text-white text-xs font-semibold transition-all" data-rarity="5">5★</button>
            <button class="rarity-filter active px-4 py-2.5 rounded-xl bg-purple-600 text-white text-xs font-semibold transition-all" data-rarity="4">4★</button>
            <button class="rarity-filter px-4 py-2.5 rounded-xl bg-[#1a181f] border border-white/5 text-gray-400 hover:text-white text-xs font-semibold transition-all" data-rarity="3">3★</button>
            <button class="rarity-filter px-4 py-2.5 rounded-xl bg-[#1a181f] border border-white/5 text-gray-400 hover:text-white text-xs font-semibold transition-all" data-rarity="2">2★</button>
            <button class="rarity-filter px-4 py-2.5 rounded-xl bg-[#1a181f] border border-white/5 text-gray-400 hover:text-white text-xs font-semibold transition-all" data-rarity="1">1★</button>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="weapons-container">
        <!-- Dynamic weapons cards will be injected here -->

      </div>
    </section>
  </main>

  <!-- Footer Section -->
  <footer class="bg-[#0a080f] border-t border-white/5 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded-lg bg-purple-600 flex items-center justify-center text-white">
            <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
          </div>
          <span class="font-display font-bold text-lg tracking-wide text-white">WUWA<span class="text-purple-500">.AIO</span></span>
        </div>
        <p class="text-xs text-gray-500 text-center md:text-right" data-i18n="footer_disclaimer"></p>
      </div>
    </div>
  </footer>

  <!-- Filter Script -->
  <script>
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    
    function toggleMobileMenu() {
      mobileMenu.classList.toggle('hidden');
      const icon = mobileMenuBtn.querySelector('i');
      if (mobileMenu.classList.contains('hidden')) {
        icon.className = 'fa-solid fa-bars text-xl';
      } else {
        icon.className = 'fa-solid fa-xmark text-xl';
      }
    }
    
    mobileMenuBtn.addEventListener('click', toggleMobileMenu);

    let cachedWeapons = null;
    let cachedCharacters = null;

    async function loadWeapons() {
      const container = document.getElementById('weapons-container');
      try {
        if (!cachedWeapons || !cachedCharacters) {
          const [weaponsRes, charactersRes] = await Promise.all([
            fetch('../assets/data/weapons.json'),
            fetch('../assets/data/characters.json')
          ]);
          if (!weaponsRes.ok || !charactersRes.ok) {
            throw new Error('Failed to fetch master databases');
          }
          cachedWeapons = Object.values(await weaponsRes.json());
          cachedCharacters = await charactersRes.json();
        }

        const lang = window.wuwaI18n ? window.wuwaI18n.getLanguage() : 'en';

        // Sort by rarity (5★ first, 1★ last)
        // If same rarity, sort by type: Rectifier, Gauntlets, Pistols, Sword, Broadblade
        const typeOrder = {
          "Rectifier": 0,
          "Gauntlets": 1,
          "Pistols": 2,
          "Sword": 3,
          "Broadblade": 4
        };

        cachedWeapons.sort((a, b) => {
          if (b.rarity !== a.rarity) {
            return b.rarity - a.rarity;
          }
          const orderA = typeOrder[a.type] !== undefined ? typeOrder[a.type] : 99;
          const orderB = typeOrder[b.type] !== undefined ? typeOrder[b.type] : 99;
          return orderA - orderB;
        });

        container.innerHTML = cachedWeapons.map(weapon => {
          const rarityColor = weapon.rarity === 5 ? 'text-yellow-400' : weapon.rarity === 4 ? 'text-purple-400' : 'text-blue-400';
          const rarityBg = weapon.rarity === 5 ? 'bg-yellow-500/10 border-yellow-500/20' : weapon.rarity === 4 ? 'bg-purple-500/10 border-purple-500/20' : 'bg-blue-500/10 border-blue-500/20';

          const weaponName = weapon.name[lang] || weapon.name.en;
          const weaponDesc = weapon.desc[lang] || weapon.desc.en;
          const secondaryStatVal = weapon.secondaryStat[lang] || weapon.secondaryStat.en;

          const isSig = weapon.signatureFor;
          const signatureLabelKey = isSig ? 'weapon_stat_signature' : 'weapon_stat_recommended';
          const signatureLabel = window.wuwaI18n ? window.wuwaI18n.t(signatureLabelKey) : (isSig ? 'Signature For:' : 'Recommended For:');

          const linkedResonators = (isSig ? [weapon.signatureFor] : (weapon.recommendedFor || [])).map(charId => {
            const char = cachedCharacters.find(c => c.id === charId);
            return char ? (char.name[lang] || char.name.en) : charId;
          }).join(', ');

          const subStatLabel = window.wuwaI18n ? window.wuwaI18n.t('weapon_stat_secondary') : 'Secondary Stat:';

          return `
            <div class="weapon-card bg-[#1a181f] border border-white/5 rounded-2xl p-6 hover:border-purple-500/20 transition-all duration-300 flex gap-4" data-type="${weapon.type}" data-rarity="${weapon.rarity}">
              <div class="w-16 h-16 rounded-xl ${rarityBg} border flex items-center justify-center ${rarityColor} font-bold text-2xl shrink-0 overflow-hidden">
                <img src="../assets/images/weapons/${weapon.id}.png" class="w-full h-full object-contain p-1" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
                <span class="hidden">${weapon.rarity}★</span>
              </div>
              <div class="flex-grow">
                <div class="flex justify-between items-start">
                  <div>
                    <h3 class="font-display font-semibold text-lg text-white">${weaponName}</h3>
                    <span class="text-[10px] text-gray-500 uppercase font-semibold">${weapon.type} • ${'★'.repeat(weapon.rarity)}</span>
                  </div>
                  <span class="text-xs ${rarityBg} border ${rarityColor} px-2 py-0.5 rounded font-bold">${weapon.baseAtk} ATK</span>
                </div>
                
                <div class="grid grid-cols-2 gap-4 my-4 p-3 bg-[#0a080f]/50 rounded-xl border border-white/5 text-xs">
                  <div>
                    <span class="block text-gray-500">${subStatLabel}</span>
                    <span class="text-white font-medium">${secondaryStatVal}</span>
                  </div>
                  <div>
                    <span class="block text-gray-500">${signatureLabel}</span>
                    <span class="text-purple-400 font-medium">${linkedResonators || '-'}</span>
                  </div>
                </div>

                <p class="text-xs text-gray-400 leading-relaxed">
                  ${weaponDesc}
                </p>
              </div>
            </div>
          `;
        }).join('');

        filterWeapons();
        if (window.wuwaI18n) window.wuwaI18n.showPage();
      } catch (err) {
        console.error('Failed to load weapons list:', err);
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-gray-400 text-sm">
            <i class="fa-solid fa-circle-exclamation text-red-500 text-2xl mb-2"></i>
            <p>Failed to load weapon database.</p>
          </div>
        `;
        if (window.wuwaI18n) window.wuwaI18n.showPage();
      }
    }

    // Filtering Weapons
    const typeButtons = document.querySelectorAll('.weapon-filter');
    const rarityButtons = document.querySelectorAll('.rarity-filter');

    function filterWeapons() {
      const activeTypeBtn = document.querySelector('.weapon-filter.active');
      const filterType = activeTypeBtn ? activeTypeBtn.dataset.type : 'all';

      const activeRarities = Array.from(document.querySelectorAll('.rarity-filter.active')).map(btn => parseInt(btn.dataset.rarity));

      const cards = document.querySelectorAll('.weapon-card');

      cards.forEach(card => {
        const cardType = card.dataset.type;
        const cardRarity = parseInt(card.dataset.rarity);

        const matchesType = (filterType === 'all' || cardType === filterType);
        const matchesRarity = activeRarities.includes(cardRarity);

        if (matchesType && matchesRarity) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    // Type Filter Click Listeners
    typeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        typeButtons.forEach(b => {
          b.classList.remove('bg-purple-600', 'text-white', 'active');
          b.classList.add('bg-[#1a181f]', 'border', 'border-white/5', 'text-gray-400');
        });
        btn.classList.remove('bg-[#1a181f]', 'border', 'border-white/5', 'text-gray-400');
        btn.classList.add('bg-purple-600', 'text-white', 'active');
        filterWeapons();
      });
    });

    // Rarity Filter Click Listeners (Multi-select)
    rarityButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) {
          btn.classList.remove('bg-purple-600', 'text-white', 'active');
          btn.classList.add('bg-[#1a181f]', 'border', 'border-white/5', 'text-gray-400');
        } else {
          btn.classList.remove('bg-[#1a181f]', 'border', 'border-white/5', 'text-gray-400');
          btn.classList.add('bg-purple-600', 'text-white', 'active');
        }
        filterWeapons();
      });
    });

    document.addEventListener('DOMContentLoaded', loadWeapons);
    window.addEventListener("wuwalangchange", loadWeapons);
  </script>
</body>
</html>
