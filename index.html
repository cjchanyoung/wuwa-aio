<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WuWa AIO - Wuthering Waves All-in-One Database</title>
  <meta name="description" content="Ultimate Wuthering Waves guide database. Real-time character builds, Echo sets, weapons, and tools powered by a serverless spreadsheet database.">
  
  <!-- Font Integrations -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="output.css">
  
  <!-- i18n Localization -->
  <script src="js/i18n.js"></script>
  
  <!-- FontAwesome Icons for gaming feel -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0a080f;
    }
    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a080f;
    }
    ::-webkit-scrollbar-thumb {
      background: #312e3f;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #504a6b;
    }
    
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .glow-effect {
      animation: pulse-glow 4s infinite ease-in-out;
    }
  </style>
</head>
<body class="text-gray-200 overflow-x-hidden min-h-screen flex flex-col selection:bg-purple-500/30 selection:text-purple-200">

  <!-- Ambient Glow Effects -->
  <div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-900/10 blur-[120px] pointer-events-none glow-effect"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-purple-900/10 blur-[120px] pointer-events-none glow-effect" style="animation-delay: 2s;"></div>

  <!-- Header Section -->
  <header class="sticky top-0 z-50 bg-[#0a080f]/80 backdrop-blur-md border-b border-purple-500/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <!-- Logo (Home Button) -->
      <a href="index.html" class="flex items-center space-x-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/20 group-hover:scale-105 transition-transform duration-300">
          <i class="fa-solid fa-wand-magic-sparkles text-white text-lg"></i>
        </div>
        <div>
          <span class="font-display font-bold text-2xl tracking-wide bg-gradient-to-r from-white via-gray-100 to-purple-400 bg-clip-text text-transparent"><span data-i18n="landing_title_prefix"></span><span class="text-purple-500" data-i18n="landing_title_suffix"></span></span>
          <span class="block text-[10px] text-gray-500 tracking-widest uppercase font-semibold" data-i18n="sub_logo"></span>
        </div>
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center space-x-1">
        <a href="characters/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_characters"></a>
        <a href="echoes/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_echoes"></a>
        <a href="weapons/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_weapons"></a>
        <a href="quick-swap/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_quickswap"></a>
        <a href="calculation/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_calculation"></a>
      </nav>

      <!-- Action Button -->
      <div class="flex items-center space-x-4">
        <!-- Mobile Menu Trigger -->
        <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 focus:outline-none">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Navigation Menu -->
  <div id="mobile-menu" class="hidden md:hidden fixed inset-0 z-40 bg-[#0a080f]/95 backdrop-blur-lg pt-24 px-6">
    <div class="flex flex-col space-y-4">
      <a href="characters/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_characters"></a>
      <a href="echoes/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_echoes"></a>
      <a href="weapons/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_weapons"></a>
      <a href="quick-swap/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_quickswap"></a>
      <a href="calculation/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_calculation"></a>
    </div>
  </div>

  <!-- Hero Section -->
  <main class="flex-grow">
    <section class="relative pt-16 pb-20 overflow-hidden border-b border-white/5">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="text-center max-w-3xl mx-auto">
          <!-- Wuthering Waves Version Badge -->
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-purple-500/10 text-purple-300 border border-purple-500/20 mb-6 animate-pulse">
            <i class="fa-solid fa-gamepad"></i> <span data-i18n="landing_version_badge"></span>
          </span>
          <h1 class="font-display font-extrabold text-4xl sm:text-5xl md:text-6xl tracking-tight text-white mb-6 leading-none" data-i18n="landing_headline"></span>
          </h1>
          <p class="text-gray-400 text-base sm:text-lg md:text-xl leading-relaxed mb-8 font-light" data-i18n="landing_subtitle"></p>

          <!-- Quick Stats Row -->
          <div class="grid grid-cols-3 gap-4 max-w-xl mx-auto bg-[#1a181f]/40 backdrop-blur border border-white/5 rounded-2xl p-4 sm:p-5 mb-8">
            <div class="text-center">
              <span class="block text-2xl font-bold text-white font-display">24+</span>
              <span class="text-xs text-gray-500 uppercase tracking-wider font-semibold" data-i18n="landing_stat_resonators"></span>
            </div>
            <div class="text-center border-x border-white/5">
              <span class="block text-2xl font-bold text-purple-400 font-display">100%</span>
              <span class="text-xs text-gray-500 uppercase tracking-wider font-semibold" data-i18n="landing_stat_serverless"></span>
            </div>
            <div class="text-center">
              <span class="block text-2xl font-bold text-yellow-400 font-display">5+</span>
              <span class="text-xs text-gray-500 uppercase tracking-wider font-semibold" data-i18n="landing_stat_modules"></span>
            </div>
          </div>

          <!-- Hero Actions -->
          <div class="flex flex-col sm:flex-row justify-center items-center gap-4">
            <a href="characters/index.html" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-purple-500/20 hover:shadow-purple-500/40 hover:-translate-y-0.5 text-center flex items-center justify-center gap-2">
              <i class="fa-solid fa-users"></i> <span data-i18n="landing_hero_btn_db"></span>
            </a>
            <a href="#features-hub" class="w-full sm:w-auto px-8 py-4 bg-[#1a181f] hover:bg-[#25222d] border border-white/10 text-gray-300 hover:text-white font-semibold rounded-xl transition-all hover:-translate-y-0.5 text-center flex items-center justify-center gap-2">
              <i class="fa-solid fa-cubes text-purple-400"></i> <span data-i18n="landing_hero_btn_features"></span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- Navigation Hub (Features Cards) -->
    <section id="features-hub" class="py-20 bg-[#1a181f]/10 border-b border-white/5 relative">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <div class="text-center max-w-2xl mx-auto mb-16">
          <h2 class="font-display font-bold text-3xl text-white tracking-wide" data-i18n="landing_features_title"></h2>
          <p class="text-gray-400 text-sm mt-3" data-i18n="landing_features_desc"></p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          
          <!-- Card 1: Characters -->
          <a href="characters/index.html" class="group bg-[#1a181f] border border-white/5 rounded-2xl p-6 sm:p-8 hover:border-purple-500/30 transition-all duration-300 hover:-translate-y-1.5 flex flex-col justify-between h-80 shadow-lg hover:shadow-purple-500/5">
            <div>
              <div class="w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400 mb-6 group-hover:scale-110 transition-transform duration-300">
                <i class="fa-solid fa-users text-xl"></i>
              </div>
              <h3 class="font-display font-bold text-xl text-white group-hover:text-purple-400 transition-colors" data-i18n="landing_card_char_title"></h3>
              <p class="text-xs text-gray-400 mt-3 leading-relaxed" data-i18n="landing_card_char_desc"></p>
            </div>
            <div class="flex items-center text-xs font-semibold text-purple-400 mt-6 gap-1 group-hover:gap-2 transition-all">
              <span data-i18n="landing_card_char_btn"></span> <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </div>
          </a>

          <!-- Card 2: Echoes -->
          <a href="echoes/index.html" class="group bg-[#1a181f] border border-white/5 rounded-2xl p-6 sm:p-8 hover:border-indigo-500/30 transition-all duration-300 hover:-translate-y-1.5 flex flex-col justify-between h-80 shadow-lg hover:shadow-indigo-500/5">
            <div>
              <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 mb-6 group-hover:scale-110 transition-transform duration-300">
                <i class="fa-solid fa-shield-halved text-xl"></i>
              </div>
              <h3 class="font-display font-bold text-xl text-white group-hover:text-indigo-400 transition-colors" data-i18n="landing_card_echo_title"></h3>
              <p class="text-xs text-gray-400 mt-3 leading-relaxed" data-i18n="landing_card_echo_desc"></p>
            </div>
            <div class="flex items-center text-xs font-semibold text-indigo-400 mt-6 gap-1 group-hover:gap-2 transition-all">
              <span data-i18n="landing_card_echo_btn"></span> <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </div>
          </a>

          <!-- Card 3: Weapons -->
          <a href="weapons/index.html" class="group bg-[#1a181f] border border-white/5 rounded-2xl p-6 sm:p-8 hover:border-yellow-500/30 transition-all duration-300 hover:-translate-y-1.5 flex flex-col justify-between h-80 shadow-lg hover:shadow-yellow-500/5">
            <div>
              <div class="w-12 h-12 rounded-xl bg-yellow-500/10 border border-yellow-500/20 flex items-center justify-center text-yellow-400 mb-6 group-hover:scale-110 transition-transform duration-300">
                <i class="fa-solid fa-khanda text-xl"></i>
              </div>
              <h3 class="font-display font-bold text-xl text-white group-hover:text-yellow-400 transition-colors" data-i18n="landing_card_weapon_title"></h3>
              <p class="text-xs text-gray-400 mt-3 leading-relaxed" data-i18n="landing_card_weapon_desc"></p>
            </div>
            <div class="flex items-center text-xs font-semibold text-yellow-400 mt-6 gap-1 group-hover:gap-2 transition-all">
              <span data-i18n="landing_card_weapon_btn"></span> <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </div>
          </a>

          <!-- Card 4: Quick-Swap -->
          <a href="quick-swap/index.html" class="group bg-[#1a181f] border border-white/5 rounded-2xl p-6 sm:p-8 hover:border-emerald-500/30 transition-all duration-300 hover:-translate-y-1.5 flex flex-col justify-between h-80 shadow-lg hover:shadow-emerald-500/5">
            <div>
              <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 mb-6 group-hover:scale-110 transition-transform duration-300">
                <i class="fa-solid fa-repeat text-xl"></i>
              </div>
              <h3 class="font-display font-bold text-xl text-white group-hover:text-emerald-400 transition-colors" data-i18n="landing_card_rotation_title"></h3>
              <p class="text-xs text-gray-400 mt-3 leading-relaxed" data-i18n="landing_card_rotation_desc"></p>
            </div>
            <div class="flex items-center text-xs font-semibold text-emerald-400 mt-6 gap-1 group-hover:gap-2 transition-all">
              <span data-i18n="landing_card_rotation_btn"></span> <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </div>
          </a>

          <!-- Card 5: Calculation -->
          <a href="calculation/index.html" class="group bg-[#1a181f] border border-white/5 rounded-2xl p-6 sm:p-8 hover:border-red-500/30 transition-all duration-300 hover:-translate-y-1.5 flex flex-col justify-between h-80 shadow-lg hover:shadow-red-500/5">
            <div>
              <div class="w-12 h-12 rounded-xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-400 mb-6 group-hover:scale-110 transition-transform duration-300">
                <i class="fa-solid fa-calculator text-xl"></i>
              </div>
              <h3 class="font-display font-bold text-xl text-white group-hover:text-red-400 transition-colors" data-i18n="landing_card_calc_title"></h3>
              <p class="text-xs text-gray-400 mt-3 leading-relaxed" data-i18n="landing_card_calc_desc"></p>
            </div>
            <div class="flex items-center text-xs font-semibold text-red-400 mt-6 gap-1 group-hover:gap-2 transition-all">
              <span data-i18n="landing_card_calc_btn"></span> <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </div>
          </a>

        </div>
      </div>
    </section>

    <!-- Architecture Section (Static visual explanation) -->
    <section class="py-20 bg-[#0a080f] relative overflow-hidden">
      <div class="absolute top-[20%] right-[-10%] w-[350px] h-[350px] rounded-full bg-purple-500/5 blur-[90px] pointer-events-none"></div>
      
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="max-w-3xl mx-auto text-center mb-16">
          <h2 class="font-display font-bold text-3xl text-white tracking-wide" data-i18n="landing_how_title"></h2>
          <p class="text-gray-400 text-sm mt-3 leading-relaxed" data-i18n="landing_how_desc"></p>
        </div>

        <div class="max-w-4xl mx-auto bg-[#1a181f] border border-white/5 rounded-2xl p-6 sm:p-8">
          <h3 class="font-display font-bold text-lg text-white mb-8 flex items-center gap-2">
            <i class="fa-solid fa-circle-nodes text-purple-500"></i>
            <span data-i18n="landing_how_pipeline"></span>
          </h3>
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 relative">
            <!-- Node 1 -->
            <div class="bg-[#0a080f] p-5 rounded-xl border border-white/5 hover:border-purple-500/20 transition-all flex flex-col justify-between">
              <div>
                <span class="block text-[10px] text-purple-400 uppercase font-bold tracking-wider mb-2" data-i18n="landing_how_step1_badge"></span>
                <h4 class="text-sm font-semibold text-white mb-2" data-i18n="landing_how_step1_title"></h4>
                <p class="text-xs text-gray-500" data-i18n="landing_how_step1_desc"></p>
              </div>
              <div class="mt-6 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>
                <span class="text-[10px] text-gray-400 font-mono" data-i18n="landing_how_step1_footer"></span>
              </div>
            </div>

            <!-- Node 2 -->
            <div class="bg-[#0a080f] p-5 rounded-xl border border-white/5 hover:border-indigo-500/20 transition-all flex flex-col justify-between">
              <div>
                <span class="block text-[10px] text-indigo-400 uppercase font-bold tracking-wider mb-2" data-i18n="landing_how_step2_badge"></span>
                <h4 class="text-sm font-semibold text-white mb-2" data-i18n="landing_how_step2_title"></h4>
                <p class="text-xs text-gray-500" data-i18n="landing_how_step2_desc"></p>
              </div>
              <div class="mt-6 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                <span class="text-[10px] text-gray-400 font-mono" data-i18n="landing_how_step2_footer"></span>
              </div>
            </div>

            <!-- Node 3 -->
            <div class="bg-[#0a080f] p-5 rounded-xl border border-white/5 hover:border-yellow-500/20 transition-all flex flex-col justify-between">
              <div>
                <span class="block text-[10px] text-yellow-400 uppercase font-bold tracking-wider mb-2" data-i18n="landing_how_step3_badge"></span>
                <h4 class="text-sm font-semibold text-white mb-2" data-i18n="landing_how_step3_title"></h4>
                <p class="text-xs text-gray-500" data-i18n="landing_how_step3_desc"></p>
              </div>
              <div class="mt-6 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-yellow-500"></span>
                <span class="text-[10px] text-gray-400 font-mono" data-i18n="landing_how_step3_footer"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer Section -->
  <footer class="bg-[#0a080f] border-t border-white/5 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded-lg bg-purple-600 flex items-center justify-center text-white">
            <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
          </div>
          <span class="font-display font-bold text-lg tracking-wide text-white">WUWA<span class="text-purple-500">.AIO</span></span>
        </div>
        <p class="text-xs text-gray-500 text-center md:text-right" data-i18n="footer_disclaimer"></p>
      </div>
    </div>
  </footer>

  <!-- Mobile Menu Script -->
  <script>
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    
    function toggleMobileMenu() {
      mobileMenu.classList.toggle('hidden');
      const icon = mobileMenuBtn.querySelector('i');
      if (mobileMenu.classList.contains('hidden')) {
        icon.className = 'fa-solid fa-bars text-xl';
      } else {
        icon.className = 'fa-solid fa-xmark text-xl';
      }
    }
    
    mobileMenuBtn.addEventListener('click', toggleMobileMenu);
  </script>
</body>
</html>
