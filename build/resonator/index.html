  <script>
    let masterCharacters = [];

    // Load master database arrays
    async function loadMasterData() {
      try {
        const response = await fetch('../../assets/data/characters.json');
        masterCharacters = await response.json();
        renderSelectorGrid();
        
        // Hide absolute loading block and reveal builder i18n
        if (window.wuwaI18n) {
          window.wuwaI18n.showPage();
        }
      } catch (e) {
        console.error("Failed to load resonators database:", e);
      }
    }

    // Render selector grid for resonators
    function renderSelectorGrid() {
      const grid = document.getElementById('resonator-select-grid');
      const searchInput = document.getElementById('resonator-search');
      if (!grid) return;

      const lang = window.wuwaI18n ? window.wuwaI18n.getLanguage() : 'en';

      function updateGrid(filter = '') {
        const filtered = masterCharacters.filter(c => {
          const name = (c.name[lang] || c.name.en || '').toLowerCase();
          const attr = (c.attribute[lang] || c.attribute.en || '').toLowerCase();
          const query = filter.toLowerCase();
          return name.includes(query) || attr.includes(query);
        });

        grid.innerHTML = filtered.map(c => {
          const attrText = c.attribute.en;
          const attrColors = {
            Spectro: 'bg-yellow-500/20 text-yellow-300 border-yellow-500/30',
            Fusion: 'bg-red-500/20 text-red-300 border-red-500/30',
            Electro: 'bg-purple-500/20 text-purple-300 border-purple-500/30',
            Aero: 'bg-teal-500/20 text-teal-300 border-teal-500/30',
            Havoc: 'bg-pink-500/20 text-pink-300 border-pink-500/30',
            Glacio: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/30'
          };
          const bClass = attrColors[attrText] || 'bg-gray-500/20 text-gray-300';
          let portraitSrc = `../../assets/images/characters/${c.id}/icon.png`;
          if (c.id === 'rover_havoc' || c.id.startsWith('rover')) {
            const isFrover = localStorage.getItem('frover_mode') === 'true';
            const roverFolder = isFrover ? 'frover' : 'rover';
            const attrId = c.attribute.en.toLowerCase();
            portraitSrc = `../../assets/images/characters/${roverFolder}/${attrId}/icon.png`;
          }

          return `
            <button onclick="selectResonator('${c.id}')" class="flex flex-col items-center p-3 border border-white/5 hover:border-purple-500/30 hover:bg-white/5 rounded-2xl cursor-pointer transition-all duration-300">
              <div class="w-14 h-14 bg-white/5 rounded-xl flex items-center justify-center overflow-hidden border border-white/10 relative mb-2 shrink-0">
                <img src="${portraitSrc}" class="w-full h-full object-contain" onerror="this.src='../../assets/images/characters/default.png'">
              </div>
              <span class="block text-xs font-bold text-white truncate max-w-full">${c.name[lang] || c.name.en}</span>
              <span class="block text-[9px] border px-1.5 py-0.5 rounded uppercase font-bold mt-1 tracking-wider ${bClass}">${c.attribute[lang] || c.attribute.en}</span>
            </button>
          `;
        }).join('\n');

        if (filtered.length === 0) {
          grid.innerHTML = `<div class="text-center py-8 text-gray-500 col-span-full">No resonators match criteria.</div>`;
        }
      }

      searchInput.addEventListener('input', (e) => updateGrid(e.target.value));
      updateGrid();
    }

    function selectResonator(id) {
      window.location.href = `./${id}/index.html`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadMasterData();

      // Listen to i18n language change events to update grid translations
      window.addEventListener("wuwalangchange", () => {
        renderSelectorGrid();
      });
    });
  </script>
