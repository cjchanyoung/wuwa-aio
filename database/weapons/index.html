  <script>
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    
    function toggleMobileMenu() {
      mobileMenu.classList.toggle('hidden');
      const icon = mobileMenuBtn.querySelector('i');
      if (mobileMenu.classList.contains('hidden')) {
        icon.className = 'fa-solid fa-bars text-xl';
      } else {
        icon.className = 'fa-solid fa-xmark text-xl';
      }
    }
    
    mobileMenuBtn.addEventListener('click', toggleMobileMenu);

    let cachedWeapons = null;
    let cachedCharacters = null;

    async function loadWeapons() {
      const container = document.getElementById('weapons-container');
      try {
        if (!cachedWeapons || !cachedCharacters) {
          const [weaponsRes, charactersRes] = await Promise.all([
            fetch('../../assets/data/weapons.json'),
            fetch('../../assets/data/characters.json')
          ]);
          if (!weaponsRes.ok || !charactersRes.ok) {
            throw new Error('Failed to fetch master databases');
          }
          cachedWeapons = Object.values(await weaponsRes.json());
          cachedCharacters = await charactersRes.json();
        }

        const lang = window.wuwaI18n ? window.wuwaI18n.getLanguage() : 'en';

        // Sort by rarity (5★ first, 1★ last)
        // If same rarity, sort by type: Rectifier, Gauntlets, Pistols, Sword, Broadblade
        const typeOrder = {
          "Rectifier": 0,
          "Gauntlets": 1,
          "Pistols": 2,
          "Sword": 3,
          "Broadblade": 4
        };

        cachedWeapons.sort((a, b) => {
          if (b.rarity !== a.rarity) {
            return b.rarity - a.rarity;
          }
          const orderA = typeOrder[a.type] !== undefined ? typeOrder[a.type] : 99;
          const orderB = typeOrder[b.type] !== undefined ? typeOrder[b.type] : 99;
          return orderA - orderB;
        });

        container.innerHTML = cachedWeapons.map(weapon => {
          let rarityColor = 'text-gray-400';
          let rarityBg = 'bg-gray-500/10 border-gray-500/20';
          let hoverBorder = 'hover:border-gray-500/30';
          if (weapon.rarity === 5) {
            rarityColor = 'text-yellow-400';
            rarityBg = 'bg-yellow-500/10 border-yellow-500/20';
            hoverBorder = 'hover:border-yellow-500/40 hover:shadow-lg hover:shadow-yellow-500/5';
          } else if (weapon.rarity === 4) {
            rarityColor = 'text-purple-400';
            rarityBg = 'bg-purple-500/10 border-purple-500/20';
            hoverBorder = 'hover:border-purple-500/40 hover:shadow-lg hover:shadow-purple-500/5';
          } else if (weapon.rarity === 3) {
            rarityColor = 'text-blue-400';
            rarityBg = 'bg-blue-500/10 border-blue-500/20';
            hoverBorder = 'hover:border-blue-500/40 hover:shadow-lg hover:shadow-blue-500/5';
          } else if (weapon.rarity === 2) {
            rarityColor = 'text-emerald-400';
            rarityBg = 'bg-emerald-500/10 border-emerald-500/20';
            hoverBorder = 'hover:border-emerald-500/30 hover:shadow-lg hover:shadow-emerald-500/5';
          }

          const weaponName = weapon.name[lang] || weapon.name.en;
          const weaponDesc = weapon.desc[lang] || weapon.desc.en;
          const secondaryStatVal = weapon.secondaryStat[lang] || weapon.secondaryStat.en;

          const isSig = weapon.signatureFor;
          const signatureLabelKey = isSig ? 'weapon_stat_signature' : 'weapon_stat_recommended';
          const signatureLabel = window.wuwaI18n ? window.wuwaI18n.t(signatureLabelKey) : (isSig ? 'Signature For:' : 'Recommended For:');

          const linkedResonators = (isSig ? [weapon.signatureFor] : (weapon.recommendedFor || [])).map(charId => {
            const char = cachedCharacters.find(c => c.id === charId);
            return char ? (char.name[lang] || char.name.en) : charId;
          }).join(', ');

          const subStatLabel = window.wuwaI18n ? window.wuwaI18n.t('weapon_stat_secondary') : 'Secondary Stat:';

          return `
            <div class="weapon-card bg-[#1a181f] border border-white/5 rounded-2xl p-4.5 ${hoverBorder} transition-all duration-300 flex flex-col gap-3 cursor-pointer" data-id="${weapon.id}" data-type="${weapon.type}" data-rarity="${weapon.rarity}">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl ${rarityBg} border flex items-center justify-center ${rarityColor} font-bold text-lg shrink-0 overflow-hidden">
                  <img src="../../assets/images/weapons/${weapon.id}.png" class="w-full h-full object-contain p-1" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
                  <span class="hidden">${weapon.rarity}★</span>
                </div>
                <div class="flex-grow min-w-0">
                  <h3 class="font-display font-semibold text-base text-white truncate">${weaponName}</h3>
                  <span class="text-[10px] text-gray-500 uppercase font-semibold block">${weapon.type} • ${'★'.repeat(weapon.rarity)}</span>
                </div>
                 <span class="s-name flex-align-center text-[10px] ${rarityBg} border ${rarityColor} px-2 py-0.5 rounded font-bold shrink-0" style="font-size: calc(32 * var(--gpx));">${weapon.baseAtk} ATK</span>
              </div>
              
              <div class="grid grid-cols-2 gap-2 p-2.5 bg-[#0a080f]/50 rounded-xl border border-white/5 text-[10px]">
                <div class="min-w-0">
                  <span class="block text-gray-500">${subStatLabel}</span>
                  <span class="s-name flex-align-center text-white font-medium truncate block" style="font-size: calc(32 * var(--gpx));">${secondaryStatVal}</span>
                </div>
                <div class="min-w-0">
                  <span class="block text-gray-500">${signatureLabel}</span>
                  <span class="text-purple-400 font-medium truncate block">${linkedResonators || '-'}</span>
                </div>
              </div>

              <p class="text-[11px] text-gray-400 leading-relaxed">
                ${weaponDesc}
              </p>
            </div>
          `;
        }).join('');

        filterWeapons();

        // Set up click handler for cards
        const cards = container.querySelectorAll('.weapon-card');
        cards.forEach(card => {
          card.addEventListener('click', () => {
            const weaponId = card.dataset.id;
            openWeaponModal(weaponId);
          });
        });

        if (window.wuwaI18n) window.wuwaI18n.showPage();
      } catch (err) {
        console.error('Failed to load weapons list:', err);
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-gray-400 text-sm">
            <i class="fa-solid fa-circle-exclamation text-red-500 text-2xl mb-2"></i>
            <p>Failed to load weapon database.</p>
          </div>
        `;
        if (window.wuwaI18n) window.wuwaI18n.showPage();
      }
    }

    // Filtering Weapons
    const typeButtons = document.querySelectorAll('.weapon-filter');
    const rarityButtons = document.querySelectorAll('.rarity-filter');

    function filterWeapons() {
      const activeTypeBtn = document.querySelector('.weapon-filter.active');
      const filterType = activeTypeBtn ? activeTypeBtn.dataset.type : 'all';

      const activeRarities = Array.from(document.querySelectorAll('.rarity-filter.active')).map(btn => parseInt(btn.dataset.rarity));

      const cards = document.querySelectorAll('.weapon-card');

      cards.forEach(card => {
        const cardType = card.dataset.type;
        const cardRarity = parseInt(card.dataset.rarity);

        const matchesType = (filterType === 'all' || cardType === filterType);
        const matchesRarity = activeRarities.includes(cardRarity);

        if (matchesType && matchesRarity) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    // Type Filter Click Listeners
    typeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        typeButtons.forEach(b => {
          b.classList.remove('bg-purple-600', 'text-white', 'active');
          b.classList.add('bg-[#1a181f]', 'border', 'border-white/5', 'text-gray-400');
        });
        btn.classList.remove('bg-[#1a181f]', 'border', 'border-white/5', 'text-gray-400');
        btn.classList.add('bg-purple-600', 'text-white', 'active');
        filterWeapons();
      });
    });

    // Rarity Filter Click Listeners (Multi-select)
    rarityButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) {
          btn.classList.remove('bg-purple-600', 'text-white', 'active');
          btn.classList.add('bg-[#1a181f]', 'border', 'border-white/5', 'text-gray-400');
        } else {
          btn.classList.remove('bg-[#1a181f]', 'border', 'border-white/5', 'text-gray-400');
          btn.classList.add('bg-purple-600', 'text-white', 'active');
        }
        filterWeapons();
      });
    });

    // Modal open/close actions
    function openWeaponModal(weaponId) {
      const weapon = cachedWeapons.find(w => w.id === weaponId);
      if (!weapon) return;

      const lang = window.wuwaI18n ? window.wuwaI18n.getLanguage() : 'en';

      let rarityColor = 'text-gray-400';
      let rarityBg = 'bg-gray-500/10 border-gray-500/20';
      if (weapon.rarity === 5) {
        rarityColor = 'text-yellow-400';
        rarityBg = 'bg-yellow-500/10 border-yellow-500/20';
      } else if (weapon.rarity === 4) {
        rarityColor = 'text-purple-400';
        rarityBg = 'bg-purple-500/10 border-purple-500/20';
      } else if (weapon.rarity === 3) {
        rarityColor = 'text-blue-400';
        rarityBg = 'bg-blue-500/10 border-blue-500/20';
      } else if (weapon.rarity === 2) {
        rarityColor = 'text-emerald-400';
        rarityBg = 'bg-emerald-500/10 border-emerald-500/20';
      }

      const weaponName = weapon.name[lang] || weapon.name.en;
      const weaponDesc = weapon.desc[lang] || weapon.desc.en;
      const secondaryStatVal = weapon.secondaryStat[lang] || weapon.secondaryStat.en;

      const isSig = weapon.signatureFor;
      const signatureLabelKey = isSig ? 'weapon_stat_signature' : 'weapon_stat_recommended';
      const signatureLabel = window.wuwaI18n ? window.wuwaI18n.t(signatureLabelKey) : (isSig ? 'Signature For:' : 'Recommended For:');

      const linkedResonators = (isSig ? [weapon.signatureFor] : (weapon.recommendedFor || [])).map(charId => {
        const char = cachedCharacters.find(c => c.id === charId);
        return char ? (char.name[lang] || char.name.en) : charId;
      }).join(', ');

      const imgContainer = document.getElementById('modal-weapon-img-container');
      imgContainer.className = `w-16 h-16 rounded-xl ${rarityBg} border flex items-center justify-center ${rarityColor} font-bold text-2xl shrink-0 overflow-hidden`;
      imgContainer.innerHTML = `
        <img src="../../assets/images/weapons/${weapon.id}.png" class="w-full h-full object-contain p-1" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
        <span class="hidden ${rarityColor}">${weapon.rarity}★</span>
      `;

      document.getElementById('modal-weapon-name').textContent = weaponName;
      document.getElementById('modal-weapon-sub').textContent = `${weapon.type} • ${'★'.repeat(weapon.rarity)}`;
      document.getElementById('modal-weapon-atk').textContent = `${weapon.baseAtk} ATK`;
      
      const subStatLabel = window.wuwaI18n ? window.wuwaI18n.t('weapon_stat_secondary') : 'Secondary Stat:';
      document.getElementById('modal-weapon-stat').innerHTML = `<span class="block text-[10px] text-gray-500">${subStatLabel}</span><span class="s-name flex-align-center text-white font-medium" style="font-size: calc(32 * var(--gpx));">${secondaryStatVal}</span>`;
      
      document.getElementById('modal-weapon-sig-label').textContent = signatureLabel;
      document.getElementById('modal-weapon-sig').textContent = linkedResonators || '-';
      document.getElementById('modal-weapon-desc').textContent = weaponDesc;

      const modal = document.getElementById('weapon-modal');
      if (window.weaponModalTimeout) {
        clearTimeout(window.weaponModalTimeout);
        window.weaponModalTimeout = null;
      }
      modal.classList.remove('hidden');
      requestAnimationFrame(() => {
        modal.classList.remove('opacity-0');
        document.getElementById('weapon-modal-card').classList.remove('scale-95');
      });
    }

    function closeWeaponModal() {
      const modal = document.getElementById('weapon-modal');
      modal.classList.add('opacity-0');
      document.getElementById('weapon-modal-card').classList.add('scale-95');
      if (window.weaponModalTimeout) {
        clearTimeout(window.weaponModalTimeout);
      }
      window.weaponModalTimeout = setTimeout(() => {
        modal.classList.add('hidden');
        window.weaponModalTimeout = null;
      }, 300);
    }

    document.getElementById('modal-close-btn').addEventListener('click', closeWeaponModal);
    document.getElementById('weapon-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('weapon-modal')) {
        closeWeaponModal();
      }
    });

    document.addEventListener('DOMContentLoaded', loadWeapons);
    window.addEventListener("wuwalangchange", loadWeapons);
  </script>
</body>
</html>
