  <!-- Web App Client Logic (Vanilla JS) -->
  <script>
    // Mobile navigation toggle
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    
    function toggleMobileMenu() {
      mobileMenu.classList.toggle('hidden');
      const icon = mobileMenuBtn.querySelector('i');
      if (mobileMenu.classList.contains('hidden')) {
        icon.className = 'fa-solid fa-bars text-xl';
      } else {
        icon.className = 'fa-solid fa-xmark text-xl';
      }
    }
    
    mobileMenuBtn.addEventListener('click', toggleMobileMenu);

    // Style configuration mapping for resonators by attribute type
    const attributeCardsStyles = {
      Fusion: {
        theme_color: '#C4294E',
        bg_to: 'to-[#C4294E]/10',
        badge: 'bg-[#C4294E]/20 text-rose-300 border border-[#C4294E]/30',
        icon_ring: 'from-[#C4294E] to-rose-400',
        icon_text: 'text-[#C4294E]',
        echo_text: 'text-[#C4294E]'
      },
      Electro: {
        theme_color: '#A431AE',
        bg_to: 'to-[#A431AE]/10',
        badge: 'bg-[#A431AE]/20 text-fuchsia-300 border border-[#A431AE]/30',
        icon_ring: 'from-[#A431AE] to-fuchsia-400',
        icon_text: 'text-[#A431AE]',
        echo_text: 'text-[#A431AE]'
      },
      Glacio: {
        theme_color: '#36AED0',
        bg_to: 'to-[#36AED0]/10',
        badge: 'bg-[#36AED0]/20 text-cyan-300 border border-[#36AED0]/30',
        icon_ring: 'from-[#36AED0] to-cyan-400',
        icon_text: 'text-[#36AED0]',
        echo_text: 'text-[#36AED0]'
      },
      Spectro: {
        theme_color: '#B9A81C',
        bg_to: 'to-[#B9A81C]/10',
        badge: 'bg-[#B9A81C]/20 text-[#B9A81C] border border-[#B9A81C]/30',
        icon_ring: 'from-[#B9A81C] to-yellow-400',
        icon_text: 'text-[#B9A81C]',
        echo_text: 'text-[#B9A81C]'
      },
      Aero: {
        theme_color: '#2EC69E',
        bg_to: 'to-[#2EC69E]/10',
        badge: 'bg-[#2EC69E]/20 text-emerald-300 border border-[#2EC69E]/30',
        icon_ring: 'from-[#2EC69E] to-emerald-400',
        icon_text: 'text-[#2EC69E]',
        echo_text: 'text-[#2EC69E]'
      },
      Havoc: {
        theme_color: '#971654',
        bg_to: 'to-[#971654]/10',
        badge: 'bg-[#971654]/20 text-rose-300 border border-[#971654]/30',
        icon_ring: 'from-[#971654] to-rose-400',
        icon_text: 'text-[#971654]',
        echo_text: 'text-[#971654]'
      }
    };

    const defaultStyles = {
      theme_color: '#a855f7',
      bg_to: 'to-purple-950/20',
      badge: 'bg-purple-500/20 text-purple-300 border border-purple-500/30',
      icon_ring: 'from-purple-600 to-indigo-400',
      icon_text: 'text-purple-400',
      echo_text: 'text-purple-400'
    };

    // Load character, weapon and echo data dynamically from JSON
    let cachedCharacters = null;
    async function loadCharacters() {
      const grid = document.getElementById('resonators-grid');
      try {
        if (!cachedCharacters) {
          const [charRes, rolesRes, sonataRes, echoesRes, weaponsRes] = await Promise.all([
            fetch('../assets/data/characters.json'),
            fetch('../assets/data/roles.json'),
            fetch('../assets/data/sonatas.json'),
            fetch('../assets/data/echoes.json'),
            fetch('../assets/data/weapons.json')
          ]);
          if (!charRes.ok || !rolesRes.ok || !sonataRes.ok || !echoesRes.ok || !weaponsRes.ok) {
            throw new Error('Failed to fetch character, roles, sonatas, echoes, or weapons JSON database');
          }
          const rawChars = await charRes.json();
          const rolesMaster = await rolesRes.json();
          const sonataMaster = await sonataRes.json();
          const echoesMaster = await echoesRes.json();
          const weaponsMaster = await weaponsRes.json();

          // Resolve ID array of roles into localized objects
          cachedCharacters = rawChars.map(char => {
            const resolved = { ...char };
            if (char.roles) {
              resolved.roles = char.roles.map(roleId => {
                const master = rolesMaster[roleId];
                return {
                  id: roleId,
                  name: master ? master.name : { en: roleId }
                };
              });
            } else {
              resolved.roles = [];
            }

            // Resolve recommEcho relations
            if (char.recommEcho) {
              const setBonusId = char.recommEcho.sonata;
              const masterSonata = sonataMaster[setBonusId];
              resolved.recommEcho.sonataObject = masterSonata ? {
                id: setBonusId,
                name: masterSonata.name
              } : { id: setBonusId, name: { en: "Custom Set" } };

              const mainEchoId = char.recommEcho.mainSlotEcho;
              const masterEcho = echoesMaster[mainEchoId];
              resolved.recommEcho.mainSlotEchoObject = masterEcho ? {
                id: mainEchoId,
                name: masterEcho.name,
                costType: masterEcho.costType
              } : { id: mainEchoId, name: { en: mainEchoId }, costType: "4" };
            }

            // Resolve recommWeapons relations
            if (char.recommWeapons && char.recommWeapons.length > 0) {
              resolved.recommWeapons = char.recommWeapons.map(w => {
                const masterWeapon = weaponsMaster[w.id];
                return {
                  ...w,
                  name: masterWeapon ? masterWeapon.name : { en: w.id }
                };
              });
            } else {
              resolved.recommWeapons = [];
            }

            return resolved;
          });
        }
        const characters = cachedCharacters;
        let lang = "en";
        try {
          lang = window.wuwaI18n ? window.wuwaI18n.getLanguage() : (localStorage.getItem("wuwa_lang") || "en");
        } catch (e) {
          console.warn("Storage access denied. Defaulting to English.");
        }
        
        // Generate and append cards
        grid.innerHTML = characters.map(char => {
          const attrId = char.attribute.en.toLowerCase();
          const weaponTypeId = char.weaponType.en.toLowerCase().replace(/s$/, '');
          const charElement = window.wuwaI18n ? window.wuwaI18n.t(`attr_${attrId}`) : char.attribute.en;
          const styles = attributeCardsStyles[char.attribute.en] || defaultStyles;
          const stars = '<i class="fa-solid fa-star"></i>'.repeat(char.rarity);
          
          const charName = char.name[lang] || char.name.en;
          const charWeaponType = window.wuwaI18n ? window.wuwaI18n.t(`weapon_${weaponTypeId}`) : char.weaponType.en;
          const viewGuideLabel = window.wuwaI18n ? window.wuwaI18n.t('view_guide_label') : 'View Guide Details';

          const searchTagParts = [char.id];
          const langsList = ['en', 'ko', 'ja', 'zh'];
          langsList.forEach(l => {
            if (char.name[l]) searchTagParts.push(char.name[l]);
            if (char.attribute && char.attribute[l]) searchTagParts.push(char.attribute[l]);
            if (char.weaponType[l]) searchTagParts.push(char.weaponType[l]);
            if (char.roles) {
              char.roles.forEach(r => {
                if (r.name[l]) searchTagParts.push(r.name[l]);
              });
            }
          });
          const searchTags = searchTagParts.join(' ').toLowerCase();
          
          return `
          <div class="resonator-card group bg-[#1a181f] border border-white/5 rounded-2xl overflow-hidden flex flex-col" style="--theme-color: ${styles.theme_color || '#a855f7'};" data-rarity="${char.rarity}-star" data-attribute="${char.attribute.en.toLowerCase()}" data-weapon="${char.weaponType.en.toLowerCase().replace(/s$/, '')}" data-id="${char.id}" data-search-tags="${searchTags}">
            <div class="relative h-36 bg-gradient-to-t from-[#1a181f] ${styles.bg_to} overflow-hidden flex items-center justify-center">
              <div class="h-full w-full flex items-center justify-center relative">
                <!-- 1. Try loading potrait.png (Jiyan typo fallback) -->
                <img src="../assets/images/characters/${char.id}/icon.png" class="h-full w-auto object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                
                <!-- 2. Final fallback to circular attribute icon -->
                <div class="w-20 h-20 rounded-full bg-gradient-to-tr ${styles.icon_ring} p-0.5 shadow-xl flex items-center justify-center" style="display:none;">
                  <div class="w-full h-full rounded-full bg-[#1a181f] flex items-center justify-center">
                    <i class="${char.icon_class} ${styles.icon_text} text-3xl"></i>
                  </div>
                </div>
              </div>
              <span class="attribute-badge absolute top-2.5 left-2.5 ${styles.badge} px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider">${charElement}</span>
              <span class="star-rating absolute top-2.5 right-2.5 text-yellow-400 text-xs flex gap-0.5">
                ${stars}
              </span>
            </div>
            <div class="p-3.5 flex flex-col justify-between flex-grow">
              <div>
                <h3 class="font-display font-bold text-lg text-white transition-colors">${charName}</h3>
                <div class="flex flex-row flex-nowrap items-center gap-1 mt-2 w-full overflow-hidden">
                  <span class="${styles.badge} px-1.5 py-0.5 rounded text-[9px] uppercase font-bold tracking-wider inline-flex items-center gap-0.5 whitespace-nowrap shrink-0">
                    <img src="../assets/images/attribute/${attrId}.png" class="w-3 h-3 object-contain">
                    <span>${charElement}</span>
                  </span>
                  <span class="bg-white/5 border border-white/10 px-1.5 py-0.5 rounded text-[9px] text-gray-400 font-bold uppercase tracking-wider inline-flex items-center gap-0.5 whitespace-nowrap shrink-0">
                    <img src="../assets/images/weapons/type/${weaponTypeId}.png" class="w-3 h-3 object-contain">
                    <span>${charWeaponType}</span>
                  </span>
                </div>
              </div>
              
              <button class="view-guide-btn w-full mt-4 py-2 bg-white/5 text-gray-300 text-xs font-semibold rounded-xl transition-all duration-300">${viewGuideLabel}</button>
            </div>
          </div>`;
        }).join('');

        // Apply filters once loaded
        filterResonators();
        if (window.wuwaI18n) window.wuwaI18n.showPage();
      } catch (err) {
        console.error('Error loading characters list:', err);
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center">
            <i class="fa-solid fa-circle-exclamation text-red-500 text-3xl mb-3"></i>
            <p class="text-gray-400 text-sm">Failed to load resonator guides. Please try again later.</p>
            <p class="text-red-400 text-xs mt-2">${err.name}: ${err.message}</p>
            <pre class="text-left text-gray-500 text-[10px] mt-4 p-4 bg-[#0a080f] rounded-lg overflow-x-auto max-w-full">${err.stack || ''}</pre>
          </div>`;
        if (window.wuwaI18n) window.wuwaI18n.showPage();
      }
    }

    // Search and Rarity Filtering Logic
    const searchInput = document.getElementById('resonator-search');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const resonatorCards = () => document.querySelectorAll('.resonator-card');

    function filterResonators() {
      const query = searchInput.value.toLowerCase().trim();
      
      const activeRarityBtn = document.querySelector('.filter-group[data-filter-type="rarity"] .filter-btn.active');
      const rarityFilter = activeRarityBtn ? activeRarityBtn.dataset.filter : 'all';

      const activeAttrBtn = document.querySelector('.filter-group[data-filter-type="attribute"] .filter-btn.active');
      const attrFilter = activeAttrBtn ? activeAttrBtn.dataset.filter : 'all';

      const activeWeaponBtn = document.querySelector('.filter-group[data-filter-type="weapon"] .filter-btn.active');
      const weaponFilter = activeWeaponBtn ? activeWeaponBtn.dataset.filter : 'all';

      resonatorCards().forEach(card => {
        const searchTags = card.dataset.searchTags || '';
        const rarity = card.dataset.rarity;
        const attribute = card.dataset.attribute;
        const weapon = card.dataset.weapon;

        const matchesSearch = !query || searchTags.includes(query);
        const matchesRarity = rarityFilter === 'all' || rarity === rarityFilter;
        const matchesAttr = attrFilter === 'all' || attribute === attrFilter;
        const matchesWeapon = weaponFilter === 'all' || weapon === weaponFilter;

        if (matchesSearch && matchesRarity && matchesAttr && matchesWeapon) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    searchInput.addEventListener('input', filterResonators);

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const group = btn.closest('.filter-group');
        if (!group) return;
        const filterType = group.dataset.filterType;

        // Deactivate other buttons in the same filter group
        group.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-purple-600', 'text-white', 'active');
          if (filterType === 'attribute') {
            b.classList.remove('bg-[#C4294E]', 'bg-[#A431AE]', 'bg-[#36AED0]', 'bg-[#B9A81C]', 'bg-[#2EC69E]', 'bg-[#971654]');
          }
          b.classList.add('bg-[#1a181f]', 'border', 'border-white/5', 'text-gray-400');
        });

        // Activate the clicked button
        btn.classList.remove('bg-[#1a181f]', 'border', 'border-white/5', 'text-gray-400');
        btn.classList.add('text-white', 'active');

        if (filterType === 'attribute') {
          const attr = btn.dataset.filter;
          if (attr === 'all') {
            btn.classList.add('bg-purple-600');
          } else if (attr === 'fusion') {
            btn.classList.add('bg-[#C4294E]');
          } else if (attr === 'electro') {
            btn.classList.add('bg-[#A431AE]');
          } else if (attr === 'glacio') {
            btn.classList.add('bg-[#36AED0]');
          } else if (attr === 'spectro') {
            btn.classList.add('bg-[#B9A81C]');
          } else if (attr === 'aero') {
            btn.classList.add('bg-[#2EC69E]');
          } else if (attr === 'havoc') {
            btn.classList.add('bg-[#971654]');
          }
        } else {
          btn.classList.add('bg-purple-600');
        }
        
        filterResonators();
      });
    });

    document.addEventListener('click', (e) => {
      const card = e.target.closest('.resonator-card');
      if (card) {
        const charId = card.dataset.id;
        const lang = window.wuwaI18n ? window.wuwaI18n.getLanguage() : 'en';
        window.location.href = charId + '/index.html?lang=' + lang;
      }
    });

    // Initialize character list loading
    document.addEventListener('DOMContentLoaded', loadCharacters);
    
    // Listen to global language change event to reload list
    window.addEventListener("wuwalangchange", () => {
      loadCharacters();
    });
  </script>
</body>
</html>
