<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Builds Database - WuWa AIO</title>
  <meta name="description" content="Complete Wuthering Waves Echoes database. Check Sonata set bonuses, main stat suggestions, and substat tuning priorities for resonators.">
  
  <!-- Font Integrations -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="../output.css">
  
  <!-- i18n Localization -->
  <script src="../js/i18n.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --gpx: 0.4px;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0a080f;
    }
    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
    .flex-align-center {
      display: flex;
      align-items: center;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a080f;
    }
    ::-webkit-scrollbar-thumb {
      background: #312e3f;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #504a6b;
    }
    
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .glow-effect {
      animation: pulse-glow 4s infinite ease-in-out;
    }
    .sonata-card:hover {
      border-color: color-mix(in srgb, var(--theme-color) 30%, transparent) !important;
    }
  </style>
</head>
<body class="text-gray-200 overflow-x-hidden min-h-screen flex flex-col selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- Ambient Glow Effects -->
  <div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-900/10 blur-[120px] pointer-events-none glow-effect"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-purple-900/10 blur-[120px] pointer-events-none glow-effect" style="animation-delay: 2s;"></div>

  <!-- Header Section -->
  <header class="sticky top-0 z-50 bg-[#0a080f]/80 backdrop-blur-md border-b border-purple-500/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <!-- Logo (Home Button) -->
      <a href="../index.html" class="flex items-center space-x-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/20 group-hover:scale-105 transition-transform duration-300">
          <i class="fa-solid fa-wand-magic-sparkles text-white text-lg"></i>
        </div>
        <div>
          <span class="font-display font-bold text-2xl tracking-wide bg-gradient-to-r from-white via-gray-100 to-purple-400 bg-clip-text text-transparent"><span data-i18n="landing_title_prefix"></span><span class="text-purple-500" data-i18n="landing_title_suffix"></span></span>
          <span class="block text-[10px] text-gray-500 tracking-widest uppercase font-semibold" data-i18n="sub_logo"></span>
        </div>
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center space-x-1">
        <a href="../characters/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_characters"></a>
        <a href="../echoes/index.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-purple-400 bg-white/5 border-b-2 border-purple-500/50 transition-all" data-i18n="nav_echoes"></a>
        <a href="../weapons/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_weapons"></a>
        <a href="../quick-swap/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_quickswap"></a>
        <a href="../calculation/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_calculation"></a>
      </nav>

      <!-- Action Button -->
      <div class="flex items-center space-x-4">
        <!-- Mobile Menu Trigger -->
        <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 focus:outline-none">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Navigation Menu -->
  <div id="mobile-menu" class="hidden md:hidden fixed inset-0 z-40 bg-[#0a080f]/95 backdrop-blur-lg pt-24 px-6">
    <div class="flex flex-col space-y-4">
      <a href="../characters/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_characters"></a>
      <a href="../echoes/index.html" class="text-xl font-semibold text-purple-400 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_echoes"></a>
      <a href="../weapons/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_weapons"></a>
      <a href="../quick-swap/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_quickswap"></a>
      <a href="../calculation/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_calculation"></a>
    </div>
  </div>

  <main class="flex-grow">
    <!-- Echo Database Header Section -->
    <section class="py-12 bg-[#1a181f]/20 border-b border-white/5">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="font-display font-bold text-4xl text-white tracking-wide flex items-center gap-3">
          <span class="w-2.5 h-8 bg-indigo-500 rounded-full inline-block"></span>
          <span data-i18n="echoes_header_title"></span>
        </h1>
        <p class="text-gray-400 text-sm mt-2" data-i18n="echoes_header_subtitle"></p>
      </div>
    </section>

    <!-- Sonata Effects Section -->
    <section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div id="sonata-sets-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 mb-16">
        <!-- Dynamically loaded from data.csv -->
      </div>

      <!-- Substat Tuning Priorities -->
      <div class="bg-[#1a181f] border border-white/5 rounded-2xl p-6 sm:p-8">
        <h3 class="font-display font-bold text-xl text-white mb-6 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-indigo-500"></i>
          <span data-i18n="echo_tuning_guide_title"></span>
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 text-xs leading-relaxed text-gray-400">
          <div>
            <h4 class="text-sm font-semibold text-white mb-3" data-i18n="echo_tuning_rules_title"></h4>
            <p class="mb-4" data-i18n="echo_tuning_rules_desc1"></span> relative to the Echo rarity.
            </p>
            <p data-i18n="echo_tuning_rules_desc2"></p>
          </div>
          <div>
            <h4 class="text-sm font-semibold text-white mb-3" data-i18n="echo_tuning_values_title"></h4>
            <ul class="space-y-2">
              <li class="flex justify-between border-b border-white/5 pb-1">
                <span class="s-name flex-align-center" style="font-size: calc(32 * var(--gpx));" data-i18n="echo_tuning_crit_rate"></span>
                <span class="s-name flex-align-center text-white font-semibold" style="font-size: calc(32 * var(--gpx));">6.3% ~ 10.5%</span>
              </li>
              <li class="flex justify-between border-b border-white/5 pb-1">
                <span class="s-name flex-align-center" style="font-size: calc(32 * var(--gpx));" data-i18n="echo_tuning_crit_dmg"></span>
                <span class="s-name flex-align-center text-white font-semibold" style="font-size: calc(32 * var(--gpx));">12.6% ~ 21.0%</span>
              </li>
              <li class="flex justify-between border-b border-white/5 pb-1">
                <span class="s-name flex-align-center" style="font-size: calc(32 * var(--gpx));" data-i18n="echo_tuning_skill_dmg"></span>
                <span class="s-name flex-align-center text-white font-semibold" style="font-size: calc(32 * var(--gpx));">6.4% ~ 12.4%</span>
              </li>
              <li class="flex justify-between border-b border-white/5 pb-1">
                <span class="s-name flex-align-center" style="font-size: calc(32 * var(--gpx));" data-i18n="echo_tuning_energy_regen"></span>
                <span class="s-name flex-align-center text-white font-semibold" style="font-size: calc(32 * var(--gpx));">7.4% ~ 12.4%</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer Section -->
  <footer class="bg-[#0a080f] border-t border-white/5 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded-lg bg-purple-600 flex items-center justify-center text-white">
            <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
          </div>
          <span class="font-display font-bold text-lg tracking-wide text-white">WUWA<span class="text-purple-500">.AIO</span></span>
        </div>
        <p class="text-xs text-gray-500 text-center md:text-right" data-i18n="footer_disclaimer"></p>
      </div>
    </div>
  </footer>

  <!-- Echo Details Modal -->
  <div id="echo-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0a080f]/85 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
    <div id="echo-modal-card" class="bg-[#1a181f] border border-white/10 rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl transition-transform duration-300 scale-95 flex flex-col">
      <!-- Modal Header with Accent Glow -->
      <div class="relative p-6 border-b border-white/5 flex gap-4 items-start">
        <div id="modal-echo-img-container" class="w-16 h-16 rounded-xl flex items-center justify-center font-bold text-2xl shrink-0 overflow-hidden border border-white/5">
          <!-- Image will be set dynamically -->
        </div>
        <div class="flex-grow min-w-0">
          <h2 id="modal-echo-name" class="font-display font-bold text-2xl tracking-wide"></h2>
          <span id="modal-echo-sub" class="text-xs uppercase font-semibold block leading-none mt-1"></span>
        </div>
        <button id="modal-close-btn" class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-white/5 transition-colors focus:outline-none">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <!-- Modal Body -->
      <div class="p-6 space-y-6 overflow-y-auto max-h-[60vh] text-sm">
        <!-- 2-Piece Effect -->
        <div class="bg-[#0a080f] p-4 rounded-xl border border-white/5">
          <span id="modal-echo-2pc-label" class="block text-gray-500 uppercase tracking-widest text-[9px] font-bold mb-1"></span>
          <span id="modal-echo-2pc" class="text-gray-300 font-medium"></span>
        </div>
        <!-- 5-Piece Effect -->
        <div class="bg-[#0a080f] p-4 rounded-xl border border-white/5">
          <span id="modal-echo-5pc-label" class="block text-gray-500 uppercase tracking-widest text-[9px] font-bold mb-1"></span>
          <span id="modal-echo-5pc" class="text-gray-300 font-medium"></span>
        </div>
        <!-- Best Resonators -->
        <div class="pt-2 flex justify-between items-center text-gray-500 text-xs">
          <span id="modal-echo-resonators-label"></span>
          <span id="modal-echo-resonators" class="text-gray-300 font-semibold"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Menu & Dynamic Echo Sync Scripts -->
  <script>
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    
    function toggleMobileMenu() {
      mobileMenu.classList.toggle('hidden');
      const icon = mobileMenuBtn.querySelector('i');
      if (mobileMenu.classList.contains('hidden')) {
        icon.className = 'fa-solid fa-bars text-xl';
      } else {
        icon.className = 'fa-solid fa-xmark text-xl';
      }
    }
    
    mobileMenuBtn.addEventListener('click', toggleMobileMenu);

    let cachedEchoes = null;
    let cachedCharacters = null;

    async function loadEchoSets() {
      const grid = document.getElementById('sonata-sets-grid');
      try {
        if (!cachedEchoes || !cachedCharacters) {
          const [sonatasRes, charactersRes] = await Promise.all([
            fetch('../assets/data/sonatas.json'),
            fetch('../assets/data/characters.json')
          ]);
          if (!sonatasRes.ok || !charactersRes.ok) {
            throw new Error('Failed to fetch master databases');
          }
          cachedEchoes = Object.values(await sonatasRes.json());
          cachedCharacters = await charactersRes.json();
        }
        
        let lang = "en";
        try {
          lang = window.wuwaI18n ? window.wuwaI18n.getLanguage() : (localStorage.getItem("wuwa_lang") || "en");
        } catch (e) {
          console.warn("Storage access denied. Defaulting to English.");
        }
        
        const echoesSet2pcLabel = window.wuwaI18n ? window.wuwaI18n.t('echoes_set_2pc') : '2-Piece Effect';
        const echoesSet5pcLabel = window.wuwaI18n ? window.wuwaI18n.t('echoes_set_5pc') : '5-Piece Effect';
        const bestResonatorsLabel = window.wuwaI18n ? window.wuwaI18n.t('best_resonators_label') : 'Best Resonators:';
        
        grid.innerHTML = cachedEchoes.map(set => {
          const setName = set.name[lang] || set.name.en;
          const setElement = set.attribute[lang] || set.attribute.en;
          const effect2pc = set.effect_2pc[lang] || set.effect_2pc.en;
          const effect5pc = set.effect_5pc[lang] || set.effect_5pc.en;
          
          const linkedResonators = set.recommendedFor.map(charId => {
            const char = cachedCharacters.find(c => c.id === charId);
            return char ? (char.name[lang] || char.name.en) : charId;
          }).join(', ');

          // 색상 값이 헥사코드(#)인지 판별하여 인라인 스타일 또는 클래스명으로 분기 적용
          const isHexText = set.textColor.startsWith('#');
          const isHexBg = set.bgColor.startsWith('#');

          const textColorClass = isHexText ? '' : set.textColor;
          const textColorStyle = isHexText ? `style="color: ${set.textColor}"` : '';

          const bgColorClass = isHexBg ? '' : set.bgColor;
          const bgColorStyle = isHexBg ? `style="background-color: ${set.bgColor}"` : '';

          // 호버 테두리용 테마 색상 값 추출 (헥사코드 혹은 Tailwind v4 CSS 변수 매핑)
          let themeColorVal = '';
          if (isHexText) {
            themeColorVal = set.textColor;
          } else if (set.textColor.startsWith('text-')) {
            const colorName = set.textColor.replace('text-', '');
            themeColorVal = `var(--color-${colorName})`;
          }

          return `
          <div class="sonata-card bg-[#1a181f] border border-white/5 rounded-2xl p-4 transition-all duration-300 shadow-lg shadow-purple-500/2 cursor-pointer" data-id="${set.id}" style="--theme-color: ${themeColorVal}">
            <div class="flex items-center gap-2.5 mb-3">
              <div class="w-8 h-8 rounded-lg ${bgColorClass} flex items-center justify-center font-bold overflow-hidden" ${bgColorStyle} ${textColorStyle}>
                <img src="../assets/images/sonatas/${set.id}.png" class="w-full h-full object-contain p-1">
              </div>
              <div>
                <h3 class="font-display font-bold text-base ${textColorClass}" ${textColorStyle}>${setName}</h3>
                <span class="text-[9px] ${textColorClass} font-bold uppercase tracking-wider block leading-none" ${textColorStyle}>${setElement}</span>
              </div>
            </div>
            <div class="space-y-2 text-[11px]">
              <div class="bg-[#0a080f] p-2.5 rounded-lg border border-white/5">
                <span class="block text-gray-500 uppercase tracking-widest text-[8px] font-bold">${echoesSet2pcLabel}</span>
                <span class="text-gray-300 font-medium">${effect2pc}</span>
              </div>
              <div class="bg-[#0a080f] p-2.5 rounded-lg border border-white/5">
                <span class="block text-gray-500 uppercase tracking-widest text-[8px] font-bold">${echoesSet5pcLabel}</span>
                <span class="text-gray-300 font-medium">${effect5pc}</span>
              </div>
              <div class="pt-1.5 border-t border-white/5 flex justify-between items-center text-gray-500">
                <span>${bestResonatorsLabel}</span>
                <span class="text-gray-300 font-semibold">${linkedResonators}</span>
              </div>
            </div>
          </div>`;
        }).join('');

        // Set up click handler for cards
        const cards = grid.querySelectorAll('.sonata-card');
        cards.forEach(card => {
          card.addEventListener('click', () => {
            const setId = card.dataset.id;
            openEchoModal(setId);
          });
        });

        if (window.wuwaI18n) window.wuwaI18n.showPage();
      } catch (err) {
        console.error('Error rendering echo sets:', err);
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-red-400">
            Failed to load Echo sets: ${err.message}
          </div>`;
        if (window.wuwaI18n) window.wuwaI18n.showPage();
      }
    }

    // Modal open/close actions
    function openEchoModal(setId) {
      const set = cachedEchoes.find(s => s.id === setId);
      if (!set) return;

      const lang = window.wuwaI18n ? window.wuwaI18n.getLanguage() : 'en';

      const setName = set.name[lang] || set.name.en;
      const setElement = set.attribute[lang] || set.attribute.en;
      const effect2pc = set.effect_2pc[lang] || set.effect_2pc.en;
      const effect5pc = set.effect_5pc[lang] || set.effect_5pc.en;
      
      const linkedResonators = set.recommendedFor.map(charId => {
        const char = cachedCharacters.find(c => c.id === charId);
        return char ? (char.name[lang] || char.name.en) : charId;
      }).join(', ');

      const isHexText = set.textColor.startsWith('#');
      const isHexBg = set.bgColor.startsWith('#');
      const textColorStyle = isHexText ? set.textColor : '';
      const bgColorStyle = isHexBg ? set.bgColor : '';

      const imgContainer = document.getElementById('modal-echo-img-container');
      imgContainer.style.backgroundColor = bgColorStyle;
      imgContainer.style.color = textColorStyle;
      imgContainer.innerHTML = `
        <img src="../assets/images/sonatas/${set.id}.png" class="w-full h-full object-contain p-1">
      `;

      const nameEl = document.getElementById('modal-echo-name');
      nameEl.textContent = setName;
      if (isHexText) {
        nameEl.style.color = textColorStyle;
        nameEl.className = 'font-display font-bold text-2xl tracking-wide';
      } else {
        nameEl.style.color = '';
        nameEl.className = `font-display font-bold text-2xl tracking-wide ${set.textColor}`;
      }

      const subEl = document.getElementById('modal-echo-sub');
      subEl.textContent = setElement;
      if (isHexText) {
        subEl.style.color = textColorStyle;
        subEl.className = 'text-xs uppercase font-semibold block leading-none mt-1';
      } else {
        subEl.style.color = '';
        subEl.className = `text-xs uppercase font-semibold block leading-none mt-1 ${set.textColor}`;
      }

      const echoesSet2pcLabel = window.wuwaI18n ? window.wuwaI18n.t('echoes_set_2pc') : '2-Piece Effect';
      const echoesSet5pcLabel = window.wuwaI18n ? window.wuwaI18n.t('echoes_set_5pc') : '5-Piece Effect';
      const bestResonatorsLabel = window.wuwaI18n ? window.wuwaI18n.t('best_resonators_label') : 'Best Resonators:';

      document.getElementById('modal-echo-2pc-label').textContent = echoesSet2pcLabel;
      document.getElementById('modal-echo-2pc').textContent = effect2pc;

      document.getElementById('modal-echo-5pc-label').textContent = echoesSet5pcLabel;
      document.getElementById('modal-echo-5pc').textContent = effect5pc;

      document.getElementById('modal-echo-resonators-label').textContent = bestResonatorsLabel;
      document.getElementById('modal-echo-resonators').textContent = linkedResonators || '-';

      const modal = document.getElementById('echo-modal');
      if (window.echoModalTimeout) {
        clearTimeout(window.echoModalTimeout);
        window.echoModalTimeout = null;
      }
      modal.classList.remove('hidden');
      requestAnimationFrame(() => {
        modal.classList.remove('opacity-0');
        document.getElementById('echo-modal-card').classList.remove('scale-95');
      });
    }

    function closeEchoModal() {
      const modal = document.getElementById('echo-modal');
      modal.classList.add('opacity-0');
      document.getElementById('echo-modal-card').classList.add('scale-95');
      if (window.echoModalTimeout) {
        clearTimeout(window.echoModalTimeout);
      }
      window.echoModalTimeout = setTimeout(() => {
        modal.classList.add('hidden');
        window.echoModalTimeout = null;
      }, 300);
    }

    document.getElementById('modal-close-btn').addEventListener('click', closeEchoModal);
    document.getElementById('echo-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('echo-modal')) {
        closeEchoModal();
      }
    });

    document.addEventListener('DOMContentLoaded', loadEchoSets);
    window.addEventListener("wuwalangchange", loadEchoSets);
  </script>
</body>
</html>
