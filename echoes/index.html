<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Builds Database - WuWa AIO</title>
  <meta name="description" content="Complete Wuthering Waves Echoes database. Check Sonata set bonuses, main stat suggestions, and substat tuning priorities for resonators.">
  
  <!-- Font Integrations -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="../output.css">
  
  <!-- i18n Localization -->
  <script src="../js/i18n.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0a080f;
    }
    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a080f;
    }
    ::-webkit-scrollbar-thumb {
      background: #312e3f;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #504a6b;
    }
    
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .glow-effect {
      animation: pulse-glow 4s infinite ease-in-out;
    }
  </style>
</head>
<body class="text-gray-200 overflow-x-hidden min-h-screen flex flex-col selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- Ambient Glow Effects -->
  <div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-900/10 blur-[120px] pointer-events-none glow-effect"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-purple-900/10 blur-[120px] pointer-events-none glow-effect" style="animation-delay: 2s;"></div>

  <!-- Header Section -->
  <header class="sticky top-0 z-50 bg-[#0a080f]/80 backdrop-blur-md border-b border-purple-500/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <!-- Logo (Home Button) -->
      <a href="../index.html" class="flex items-center space-x-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/20 group-hover:scale-105 transition-transform duration-300">
          <i class="fa-solid fa-wand-magic-sparkles text-white text-lg"></i>
        </div>
        <div>
          <span class="font-display font-bold text-2xl tracking-wide bg-gradient-to-r from-white via-gray-100 to-purple-400 bg-clip-text text-transparent"><span data-i18n="landing_title_prefix"></span><span class="text-purple-500" data-i18n="landing_title_suffix"></span></span>
          <span class="block text-[10px] text-gray-500 tracking-widest uppercase font-semibold" data-i18n="sub_logo"></span>
        </div>
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center space-x-1">
        <a href="../characters/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_characters"></a>
        <a href="../echoes/index.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-purple-400 bg-white/5 border-b-2 border-purple-500/50 transition-all" data-i18n="nav_echoes"></a>
        <a href="../weapons/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_weapons"></a>
        <a href="../quick-swap/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_quickswap"></a>
        <a href="../calculation/index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all" data-i18n="nav_calculation"></a>
      </nav>

      <!-- Action Button -->
      <div class="flex items-center space-x-4">
        <!-- Mobile Menu Trigger -->
        <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 focus:outline-none">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Navigation Menu -->
  <div id="mobile-menu" class="hidden md:hidden fixed inset-0 z-40 bg-[#0a080f]/95 backdrop-blur-lg pt-24 px-6">
    <div class="flex flex-col space-y-4">
      <a href="../characters/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_characters"></a>
      <a href="../echoes/index.html" class="text-xl font-semibold text-purple-400 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_echoes"></a>
      <a href="../weapons/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_weapons"></a>
      <a href="../quick-swap/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_quickswap"></a>
      <a href="../calculation/index.html" class="text-xl font-medium text-gray-300 py-2 border-b border-white/5" onclick="toggleMobileMenu()" data-i18n="nav_calculation"></a>
    </div>
  </div>

  <main class="flex-grow">
    <!-- Echo Database Header Section -->
    <section class="py-12 bg-[#1a181f]/20 border-b border-white/5">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="font-display font-bold text-4xl text-white tracking-wide flex items-center gap-3">
          <span class="w-2.5 h-8 bg-indigo-500 rounded-full inline-block"></span>
          <span data-i18n="echoes_header_title"></span>
        </h1>
        <p class="text-gray-400 text-sm mt-2" data-i18n="echoes_header_subtitle"></p>
      </div>
    </section>

    <!-- Sonata Effects Section -->
    <section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div id="sonata-sets-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-16">
        <!-- Dynamically loaded from data.csv -->
      </div>

      <!-- Substat Tuning Priorities -->
      <div class="bg-[#1a181f] border border-white/5 rounded-2xl p-6 sm:p-8">
        <h3 class="font-display font-bold text-xl text-white mb-6 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-indigo-500"></i>
          <span data-i18n="echo_tuning_guide_title"></span>
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 text-xs leading-relaxed text-gray-400">
          <div>
            <h4 class="text-sm font-semibold text-white mb-3" data-i18n="echo_tuning_rules_title"></h4>
            <p class="mb-4" data-i18n="echo_tuning_rules_desc1"></span> relative to the Echo rarity.
            </p>
            <p data-i18n="echo_tuning_rules_desc2"></p>
          </div>
          <div>
            <h4 class="text-sm font-semibold text-white mb-3" data-i18n="echo_tuning_values_title"></h4>
            <ul class="space-y-2">
              <li class="flex justify-between border-b border-white/5 pb-1">
                <span data-i18n="echo_tuning_crit_rate"></span>
                <span class="text-white font-semibold">6.3% ~ 10.5%</span>
              </li>
              <li class="flex justify-between border-b border-white/5 pb-1">
                <span data-i18n="echo_tuning_crit_dmg"></span>
                <span class="text-white font-semibold">12.6% ~ 21.0%</span>
              </li>
              <li class="flex justify-between border-b border-white/5 pb-1">
                <span data-i18n="echo_tuning_skill_dmg"></span>
                <span class="text-white font-semibold">6.4% ~ 12.4%</span>
              </li>
              <li class="flex justify-between border-b border-white/5 pb-1">
                <span data-i18n="echo_tuning_energy_regen"></span>
                <span class="text-white font-semibold">7.4% ~ 12.4%</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer Section -->
  <footer class="bg-[#0a080f] border-t border-white/5 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded-lg bg-purple-600 flex items-center justify-center text-white">
            <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
          </div>
          <span class="font-display font-bold text-lg tracking-wide text-white">WUWA<span class="text-purple-500">.AIO</span></span>
        </div>
        <p class="text-xs text-gray-500 text-center md:text-right" data-i18n="footer_disclaimer"></p>
      </div>
    </div>
  </footer>

  <!-- Mobile Menu & Dynamic Echo Sync Scripts -->
  <script>
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    
    function toggleMobileMenu() {
      mobileMenu.classList.toggle('hidden');
      const icon = mobileMenuBtn.querySelector('i');
      if (mobileMenu.classList.contains('hidden')) {
        icon.className = 'fa-solid fa-bars text-xl';
      } else {
        icon.className = 'fa-solid fa-xmark text-xl';
      }
    }
    
    mobileMenuBtn.addEventListener('click', toggleMobileMenu);

    let cachedEchoes = null;
    let cachedCharacters = null;

    async function loadEchoSets() {
      const grid = document.getElementById('sonata-sets-grid');
      try {
        if (!cachedEchoes || !cachedCharacters) {
          const [sonatasRes, charactersRes] = await Promise.all([
            fetch('../assets/data/sonatas.json'),
            fetch('../assets/data/characters.json')
          ]);
          if (!sonatasRes.ok || !charactersRes.ok) {
            throw new Error('Failed to fetch master databases');
          }
          cachedEchoes = Object.values(await sonatasRes.json());
          cachedCharacters = await charactersRes.json();
        }
        
        let lang = "en";
        try {
          lang = window.wuwaI18n ? window.wuwaI18n.getLanguage() : (localStorage.getItem("wuwa_lang") || "en");
        } catch (e) {
          console.warn("Storage access denied. Defaulting to English.");
        }
        
        const echoesSet2pcLabel = window.wuwaI18n ? window.wuwaI18n.t('echoes_set_2pc') : '2-Piece Effect';
        const echoesSet5pcLabel = window.wuwaI18n ? window.wuwaI18n.t('echoes_set_5pc') : '5-Piece Effect';
        const bestResonatorsLabel = window.wuwaI18n ? window.wuwaI18n.t('best_resonators_label') : 'Best Resonators:';
        
        grid.innerHTML = cachedEchoes.map(set => {
          const setName = set.name[lang] || set.name.en;
          const setElement = set.attribute[lang] || set.attribute.en;
          const effect2pc = set.effect_2pc[lang] || set.effect_2pc.en;
          const effect5pc = set.effect_5pc[lang] || set.effect_5pc.en;
          
          const linkedResonators = set.recommendedFor.map(charId => {
            const char = cachedCharacters.find(c => c.id === charId);
            return char ? (char.name[lang] || char.name.en) : charId;
          }).join(', ');
          
          let hoverClass = 'hover:border-purple-500/30';
          if (set.id === 'celestial_light') hoverClass = 'hover:border-yellow-500/30';
          else if (set.id === 'molten_rift') hoverClass = 'hover:border-red-500/30';
          else if (set.id === 'sierra_gale') hoverClass = 'hover:border-emerald-500/30';
          else if (set.id === 'sun_sinking_havoc') hoverClass = 'hover:border-indigo-500/30';
          else if (set.id === 'rejuvenating_glow') hoverClass = 'hover:border-green-500/30';

          return `
          <div class="bg-[#1a181f] border border-white/5 rounded-2xl p-6 ${hoverClass} transition-all duration-300 shadow-lg shadow-purple-500/2">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-10 h-10 rounded-lg ${set.bgColor} flex items-center justify-center ${set.textColor} font-bold overflow-hidden">
                <img src="../assets/images/sonatas/${set.id}.png" class="w-full h-full object-contain p-1" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
                <i class="${set.icon} hidden"></i>
              </div>
              <div>
                <h3 class="font-display font-bold text-lg text-white">${setName}</h3>
                <span class="text-[10px] ${set.textColor} font-bold uppercase tracking-wider">${setElement}</span>
              </div>
            </div>
            <div class="space-y-3 text-xs">
              <div class="bg-[#0a080f] p-3 rounded-lg border border-white/5">
                <span class="block text-gray-500 uppercase tracking-widest text-[9px] font-bold">${echoesSet2pcLabel}</span>
                <span class="text-gray-300 font-medium">${effect2pc}</span>
              </div>
              <div class="bg-[#0a080f] p-3 rounded-lg border border-white/5">
                <span class="block text-gray-500 uppercase tracking-widest text-[9px] font-bold">${echoesSet5pcLabel}</span>
                <span class="text-gray-300 font-medium">${effect5pc}</span>
              </div>
              <div class="pt-2 border-t border-white/5 flex justify-between items-center text-gray-500">
                <span>${bestResonatorsLabel}</span>
                <span class="text-gray-300 font-semibold">${linkedResonators}</span>
              </div>
            </div>
          </div>`;
        }).join('');
        if (window.wuwaI18n) window.wuwaI18n.showPage();
      } catch (err) {
        console.error('Error rendering echo sets:', err);
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-red-400">
            Failed to load Echo sets: ${err.message}
          </div>`;
        if (window.wuwaI18n) window.wuwaI18n.showPage();
      }
    }

    document.addEventListener('DOMContentLoaded', loadEchoSets);
    window.addEventListener("wuwalangchange", loadEchoSets);
  </script>
</body>
</html>
